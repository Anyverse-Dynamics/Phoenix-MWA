[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-mwa"
version = "0.1.0"
description = "Phoenix-MWA world-action model post-training and simulation evaluation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
dependencies = [
  "accelerate>=1.12,<2",
  "av>=16,<18",
  "datasets==3.6.0",
  "einops>=0.8.1,<0.9",
  "gitpython>=3.1.45,<4",
  "huggingface-hub>=0.33,<2",
  "hydra-core>=1.3.2,<1.4",
  "imageio>=2.37,<3",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "numpy==1.26.4",
  "omegaconf>=2.3,<2.4",
  "packaging>=25",
  "pandas>=2.2.3,<3",
  "pillow>=12,<13",
  "pyarrow>=23,<26",
  "PyYAML==6.0.3",
  "scipy>=1.15,<2",
  "regex>=2025.11.3",
  "rich>=14.2,<16",
  "safetensors>=0.5.3,<1",
  "termcolor>=2.5,<4",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "tqdm>=4.66.5,<5",
  "transformers>=4.53.3,<6",
  "typing-extensions>=4.15",
]

[project.optional-dependencies]
train = ["deepspeed>=0.18.5,<0.19", "torchcodec==0.5"]
logging = ["wandb>=0.23.1,<1"]
modelscope = ["modelscope>=1.34,<2"]
robocasa-policy = ["websockets>=15,<17", "msgpack>=1,<2"]
eval = [
  "future>=1.0,<2",
  "mujoco==3.3.2", "robosuite==1.4.0", "robomimic==0.2.0",
  "bddl==1.0.1", "gym==0.25.2", "easydict==1.9",
  "opencv-python==4.6.0.66", "Wand==0.7.2", "scikit-image==0.25.2",
  "h5py==3.16.0", "cloudpickle==3.1.2", "PyOpenGL==3.1.10",
  "glfw==2.10.2", "matplotlib==3.10.9", "numba==0.67.0",
]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wam*"]

[tool.setuptools.package-data]
"wam.model.modules.codecs.dino_stvae" = ["*.json"]
"wam.third_party" = ["dino_runtime/**/*.py", "dino_runtime/dinov3/.source-commit", "dino_runtime/dinov3/LICENSE.md", "dino_runtime/STARVLA-LICENSE"]
