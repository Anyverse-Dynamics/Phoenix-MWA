[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-pretrain"
version = "0.1.0"
description = "Phoenix standalone Joint96 world-action pretraining"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "datasets==3.6.0",
  "einops==0.8.1",
  "gitpython==3.1.45",
  "huggingface-hub>=0.30,<1",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "packaging==25.0",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "pyarrow==23.0.0",
  "PyYAML==6.0.3",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "termcolor==2.5.0",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "tqdm==4.66.5",
  "transformers==4.53.3",
  "timm==1.0.26",
  "typing-extensions==4.15.0",
]

[project.optional-dependencies]
train = ["deepspeed==0.18.5"]
logging = ["wandb==0.23.1"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wam*"]

[tool.setuptools.package-data]
"wam.third_party" = ["dino_runtime/**/*.py", "dino_runtime/dinov3/.source-commit", "dino_runtime/dinov3/LICENSE.md", "dino_runtime/STARVLA-LICENSE"]
