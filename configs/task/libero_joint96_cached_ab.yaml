# @package _global_
defaults:
  - libero_joint96_cached
  - override /data: libero_joint96_cached_ab
  - _self_

joint96_posttrain:
  expected_pretrain_step: null # deprecated; actual step is read from checkpoint
  libero_frame_contract: libero_osc_ab_v1
init_checkpoint: ${oc.env:WAM_PRETRAIN_CHECKPOINT}
batch_size: 4
num_epochs: 50
learning_rate: 1.0e-4
min_learning_rate: 5.0e-7
save_every: 5000
max_weight_checkpoints: 15
wandb:
  project: Phoenix-Encoder
