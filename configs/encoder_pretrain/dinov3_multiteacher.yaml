run_id: encoder_pretrain
run_root_dir: outputs/encoder_pretrain
seed: 42
is_debug: false
wandb_project: Phoenix-Encoder
wandb_entity: null
wandb_run_id: null
datasets:
  ego_video_data:
    video_view_mode: all
    data_root_dir: .
    num_workers: 2
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 1
    worker_restart_interval_batches: 500
    video_backend: pyav
    video_backend_kwargs: {}
    catalog_cache_dir: outputs/encoder_pretrain/catalog_cache
    catalog_cache_version: phoenix-v1
    catalog_cache_mode: auto
    shuffle: true
    drop_last: true
    resize: null
    target_fps: 10
    clip_stride: 1
    clip_sampling_mode: disjoint_window
    unique_window_span: auto
    include_action: false
    length_buckets:
    - 4
    - 8
    - 12
    - 16
    length_probs:
    - 0.25
    - 0.25
    - 0.25
    - 0.25
    stride_buckets:
    - 1
    - 2
    stride_probs:
    - 0.5
    - 0.5
    bucket_sampling: epoch_balanced
    per_device_frame_budget: 32
    shuffle_block_size: 262144
    dataset_sampling: stratified_view_temperature
    dataset_temperature: 0.5
    sampling_group_probs:
      ego_general: 0.4
      robot: 0.6
    view_role_probs:
      primary: 0.5
      auxiliary: 0.5
    datasets:
    - name: ego_example
      sampling_group: ego_general
      video_key: observation.images.head
      path: ${oc.env:PHOENIX_EGO_DATA}
    - name: robot_example
      sampling_group: robot
      video_key: observation.images.front
      path: ${oc.env:PHOENIX_ROBOT_DATA}

framework:
  multi_teacher_distillation:
    mode: joint
    dino:
      source_commit: 6876159a11b4df116f30f667f8c9888617df0751
      checkpoint: ${oc.env:PHOENIX_VGGT_CHECKPOINT}
      checkpoint_prefix: aggregator.patch_embed.
    adapter:
      width: 1024
      depth: 8
      num_heads: 16
      mlp_ratio: 4.0
      num_register_tokens: 16
      supervision_taps:
      - 1
      - 3
      - 5
      - 7
    vggt:
      source_path: ${oc.env:PHOENIX_VGGT_SOURCE}
      source_commit: 39a0cb8af88554f15ddcb5354cd52bde588fa014
      checkpoint: ${oc.env:PHOENIX_VGGT_CHECKPOINT}
      frames_chunk_size: 8
      final_relation_weight: 0.1
      final_relation_warmup_fraction: 0.05
    vjepa:
      source_path: ${oc.env:PHOENIX_VJEPA_SOURCE}
      source_commit: 204698b45b3712590f06245fbfba32d3be539812
      checkpoint: ${oc.env:PHOENIX_VJEPA_CHECKPOINT}
      predictor_width: 384
      predictor_depth: 4
      predictor_num_heads: 12
      context_weight_max: 0.5
      context_weight_warmup_fraction: 0.2
      mask_curriculum_fraction: 0.2
      mask_start_union_min: 0.35
      mask_start_union_max: 0.55
      mask_union_min: 0.5
      mask_union_max: 0.9
      mask_small_area_start: 0.07
      mask_small_area_end: 0.15
      mask_large_area_start: 0.25
      mask_large_area_end: 0.7
    ema_momentum: 0.9999
trainer:
  max_train_steps: 160000
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  precision: bf16
  logging_frequency: 10
  save_interval: 2500
  resume_from: null
  first_teacher: vggt
  warmup_fraction: 0.05
  activation_checkpointing: false
  learning_rate:
    dino_peak: 1.0e-05
    dino_final: 1.0e-06
    adapter_peak: 0.0001
    adapter_final: 1.0e-05
    vjepa_predictor_peak: 0.0001
    vjepa_predictor_final: 1.0e-05
    vggt_projector_peak: 0.0001
    vggt_projector_final: 1.0e-06
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 0.05
tracking:
  enabled: false
